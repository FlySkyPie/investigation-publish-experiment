[project]
name = "2026-11-14_trilium-playground-2"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Wei Ji (FlySkyPie)",email = "c445dj544@gmail.com"},
]
dependencies = ["pydantic>=2.14.3", "pydantic-settings>=2.16.3", "requests>=2.34.2"]
requires-python = "==3.12.*"
readme = "README.md"
license = "MIT"


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start.cmd="python -m app.download"
start.env_file=".env"

upload.cmd="python -m app.upload"
upload.env_file=".env"

patch.cmd="python -m app.patch_export"
patch.env_file=".env"